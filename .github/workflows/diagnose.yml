name: 诊断依赖（临时）

on:
  push:
    branches: [ci/diagnose-arch-gate]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 安装 SDK 依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libncurses-dev zlib1g-dev gawk git \
            gettext libssl-dev xsltproc rsync wget unzip python3 zstd

      - name: 拉取 SDK
        env:
          SDK_URL: https://downloads.openwrt.org/releases/24.10.8/targets/x86/64/openwrt-sdk-24.10.8-x86-64_gcc-13.3.0_musl.Linux-x86_64.tar.zst
        run: |
          mkdir -p "${GITHUB_WORKSPACE}/sdk"
          wget -q "${SDK_URL}" -O sdk.tar.zst
          tar --zstd -xf sdk.tar.zst -C "${GITHUB_WORKSPACE}/sdk" --strip-components=1

      - name: 准备 feeds
        working-directory: ${{ github.workspace }}/sdk
        run: |
          echo "src-link kdae ${GITHUB_WORKSPACE}/openwrt" >> feeds.conf.default
          ./scripts/feeds update base luci packages kdae
          ./scripts/feeds install -a -p kdae

      - name: 逐个依赖二分
        working-directory: ${{ github.workspace }}/sdk
        run: |
          set_deps() {
            python3 - "$1" <<'PY'
          import re, sys, os
          p = os.environ['GITHUB_WORKSPACE'] + '/openwrt/kdae-panel/Makefile'
          s = open(p).read()
          s = re.sub(r'\n  DEPENDS:=(?:[^\n]*\\\n)*[^\n]*\n',
                     '\n  DEPENDS:=' + sys.argv[1] + '\n', s, count=1)
          open(p, 'w').write(s)
          PY
          }
          try_deps() {
            echo "######## $1"
            set_deps "$2"
            grep -n 'DEPENDS' "${GITHUB_WORKSPACE}/openwrt/kdae-panel/Makefile"
            rm -rf tmp
            {
              echo 'CONFIG_PACKAGE_kdae-panel=m'
              echo 'CONFIG_PACKAGE_luci-app-kdae-panel=m'
            } >> .config
            make defconfig > /dev/null 2>&1
            echo "-- Kconfig 条目"
            awk '/^config PACKAGE_kdae-panel$/{f=1} f{print; n++} n>8{exit}' tmp/.config-package.in \
              || echo "(没有条目)"
            echo "-- defconfig 之后"
            grep -E 'PACKAGE_kdae-panel' .config || echo "(被丢掉了)"
          }

          for k in kmod-sched-core kmod-sched-bpf kmod-veth kmod-nft-bridge kmod-xdp-sockets-diag; do
            try_deps "单独 +${k}" "+${k}"
          done
          # 参考项目 QiuSimons/luci-app-daed 在官方 SDK 上能出包，它的依赖里没有
          # kmod-nft-bridge。按它那套试一遍。
          try_deps "daed 那套（无 nft-bridge）" \
            '@(x86_64||aarch64||i386) +ca-bundle +kmod-sched-core +kmod-sched-bpf +kmod-xdp-sockets-diag +kmod-veth'
