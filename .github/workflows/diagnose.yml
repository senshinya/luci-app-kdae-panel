name: 诊断架构闸门（临时）

# workflow_dispatch 要求文件已经在默认分支上，这份用完即删的工作流不进 main，
# 因此改成只在诊断分支的 push 上触发。
on:
  push:
    branches: [ci/diagnose-arch-gate]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 安装 SDK 依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libncurses-dev zlib1g-dev gawk git \
            gettext libssl-dev xsltproc rsync wget unzip python3 zstd

      - name: 拉取 SDK
        env:
          SDK_URL: https://downloads.openwrt.org/releases/24.10.8/targets/x86/64/openwrt-sdk-24.10.8-x86-64_gcc-13.3.0_musl.Linux-x86_64.tar.zst
        run: |
          mkdir -p "${GITHUB_WORKSPACE}/sdk"
          wget -q "${SDK_URL}" -O sdk.tar.zst
          tar --zstd -xf sdk.tar.zst -C "${GITHUB_WORKSPACE}/sdk" --strip-components=1

      - name: 准备 feeds
        working-directory: ${{ github.workspace }}/sdk
        run: |
          ./scripts/feeds update base luci packages
          ./scripts/feeds install luci-base
          cp -r "${GITHUB_WORKSPACE}/openwrt" package/kdae

      - name: 查包为什么进不了 Kconfig
        working-directory: ${{ github.workspace }}/sdk
        run: |
          show() {
            echo "######## $1"
            echo "-- .packageinfo 里的 kdae-panel 条目"
            grep -n -A22 '^Package: kdae-panel$' tmp/.packageinfo | head -26 || echo "(扫描结果里没有这个包)"
            echo "-- .packageinfo 里有没有 ca-bundle"
            grep -n '^Package: ca-bundle$' tmp/.packageinfo || echo "(没有 ca-bundle)"
            echo "-- .config-package.in 里出现的 kdae 行"
            grep -n 'kdae' tmp/.config-package.in | head -12 || echo "(没有 kdae 条目)"
            echo "-- .config 里的选中状态"
            grep -E 'PACKAGE_kdae-panel' .config || echo "(不存在)"
          }
          select_pkgs() {
            {
              echo 'CONFIG_PACKAGE_kdae-panel=m'
              echo 'CONFIG_PACKAGE_luci-app-kdae-panel=m'
            } >> .config
          }

          select_pkgs
          make defconfig > /dev/null 2>&1
          show "现状：feeds 只装了 luci-base"

          # 假设：官方 SDK 的 package/ 里没有 ca-bundle，DEPENDS 里那个 +ca-bundle
          # 因此指向一个不存在的包，包的 Kconfig 条目被整个丢掉。装上再看。
          ./scripts/feeds install ca-bundle
          rm -rf tmp
          select_pkgs
          make defconfig > /dev/null 2>&1
          show "装上 ca-bundle 之后"
