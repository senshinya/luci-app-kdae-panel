name: Release

# 只认规范的版本 tag。v* 会把随手打的实验 tag 也发成正式 release，
# 而 releases/latest 是用户找包的入口，实验版不该出现在那里。
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'

permissions:
  contents: write

jobs:
  # 本仓库只发 OpenWrt 软件包，Release 的资产全部由 packages job 附上去。
  # 这个 job 只做两件事：发布前把源码验一遍，然后建一个空的 Release 容器。
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.25.12'
          cache: true

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.x'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci --prefix web
      - name: 完整发布前验证
        run: |
          npm run typecheck --prefix web
          npm test --prefix web
          npm run build --prefix web
          git diff --exit-code -- internal/webui/dist
          go test ./...
          go vet ./...
          go test -race ./...
          go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...

      - uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          generate_release_notes: true
          # 带连字符的 tag（v1.0.0-rc1）标为预发布：它不会成为 releases/latest，
          # 而发布链路本身仍被完整演练一遍。软件包的版本号也会跟着降级
          # （ipk 的 1.0.0~rc1、apk 的 1.0.0_rc1，都排在正式版之前）。
          prerelease: ${{ contains(github.ref_name, '-') }}

  # 软件包必须在这里显式调用，不能指望 openwrt.yml 自己的 release: published 触发器：
  # 用 GITHUB_TOKEN 创建的 release 不会触发新的工作流，那个触发器对本流水线发出的
  # 版本永远不响，六个架构的包会一个都附不上去。
  packages:
    needs: release
    uses: ./.github/workflows/openwrt.yml
    with:
      version: ${{ github.ref_name }}
    permissions:
      contents: write

  # 正式版的包全部附上去之后，RC 已完成使命；同时删除 Release 与 tag，
  # 避免版本列表持续堆积。预发布自身不会触发这一步。
  cleanup-prereleases:
    needs: packages
    if: ${{ !contains(github.ref_name, '-') }}
    uses: ./.github/workflows/cleanup-prereleases.yml
